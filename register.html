<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>STUDY PORTAL</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="auth-page">
  <div class="auth-card register-card">
    
    <!-- Header -->
    <div class="auth-header">
      <a href="/" class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Study Portal</span>
      </a>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Join thousands of students sharing notes and practicing past questions.</p>
    </div>

    <!-- Quick Social Signup -->
    <div class="social-login">
      <button type="button" id="google-signup-btn" class="btn btn-google" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 17C3.7 20.7 7.5 24 12 24z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>
    </div>

    <div class="auth-divider">
      <span>or register with email</span>
    </div>

    <!-- Registration Form -->
    <form class="auth-form" action="/api/auth/register" method="POST">
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="fullName" name="fullName" required placeholder="e.g. Oluwaferanmi Matti" autocomplete="name" />
        </div>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" required placeholder="student@university.edu.ng" autocomplete="email" />
        </div>
      </div>

      <!-- Academic Onboarding: School & Level -->
      <div class="form-row">
        <div class="form-group">
          <label for="institution">Institution</label>
          <select id="institution" name="institution" class="form-select" required>
            <option value="" disabled selected>Select School</option>
            <option value="lasu">Lagos State Univ. (LASU)</option>
            <option value="unilag">Univ. of Lagos (UNILAG)</option>
            <option value="oau">Obafemi Awolowo Univ. (OAU)</option>
            <option value="ui">Univ. of Ibadan (UI)</option>
            <option value="abu">Ahmadu Bello Univ. (ABU)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="level">Current Level</label>
          <select id="level" name="level" class="form-select" required>
            <option value="" disabled selected>Select Level</option>
            <option value="100">100 Level</option>
            <option value="200">200 Level</option>
            <option value="300">300 Level</option>
            <option value="400">400 Level</option>
            <option value="500">500 Level</option>
          </select>
        </div>
      </div>

      <!-- Faculty & Department -->
      <div class="form-group">
        <label for="department">Department</label>
        <select id="department" name="department" class="form-select" required>
          <option value="" disabled selected>Choose Department</option>
          <option value="computer-science">Computer Science</option>
          <option value="electrical-eng">Electrical & Electronics Eng.</option>
          <option value="biochemistry">Biochemistry</option>
          <option value="economics">Economics</option>
          <option value="microbiology">Microbiology</option>
        </select>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" required placeholder="Min. 8 characters" autocomplete="new-password" minlength="8" />
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <!-- Terms & Legal Consent -->
      <div class="form-checkbox-group">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="copyright.html" target="_blank">Copyright Policy</a>.
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-submit">Create Account</button>
    </form>

    <!-- Login Redirect Footer -->
    <div class="auth-footer">
      <p>Already have an account? <a href="login.html">Sign in here</a></p>
    </div>

  </div>
</main>
<script src="script.js"></script>
    </body>
</html>
