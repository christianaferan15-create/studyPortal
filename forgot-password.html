<!DOCTYPE html>
<html>
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>STUDY PORTAL</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="auth-page">
  <div class="auth-card">
    
    <!-- Header -->
    <div class="auth-header">
      <a href="/" class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Study Portal</span>
      </a>
    </div>

    <!-- STATE 1: Request Password Reset Form -->
    <div id="reset-request-step">
      <div class="auth-header text-center">
        <div class="key-icon-wrapper">
          🔑
        </div>
        <h1 class="auth-title">Forgot password?</h1>
        <p class="auth-subtitle">No worries! Enter your registered email address and we'll send you a link to reset your password.</p>
      </div>

      <form class="auth-form" onsubmit="handlePasswordReset(event)">
        <div class="form-group">
          <label for="reset-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="reset-email" name="email" required placeholder="student@university.edu.ng" autocomplete="email" />
          </div>
        </div>

        <button type="submit" class="btn btn-submit" id="reset-btn">
          <span>Send Reset Link</span>
        </button>
      </form>
    </div>

    <!-- STATE 2: Success / Check Email View (Hidden by default) -->
    <div id="reset-success-step" class="hidden">
      <div class="auth-header text-center">
        <div class="email-icon-wrapper">
          📩
        </div>
        <h1 class="auth-title">Check your email</h1>
        <p class="auth-subtitle">
          We’ve sent a password reset link to <strong id="sent-email-display" class="highlight-email">student@university.edu.ng</strong>.
        </p>
      </div>

      <div class="success-actions">
        <p class="resend-text">Didn't receive the email? Check your spam folder or try again.</p>
        <button type="button" class="btn btn-secondary-auth" onclick="resendResetEmail()">
          Resend Link
        </button>
      </div>
    </div>

    <!-- Back to Login Link -->
    <div class="auth-footer">
      <a href="login.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Sign In</span>
      </a>
    </div>

  </div>
</main>
<script src="script.js"></script>
    </body>
    </html>
